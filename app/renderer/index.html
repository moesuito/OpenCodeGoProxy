<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenCodeGoProxy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", sans-serif; margin: 0; background: #000; color: #f0f0f0; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 22px 6px; }
  header img { width: 30px; height: 30px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #555; margin-left: auto; }
  #dot.on { background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  main { padding: 12px 22px 28px; max-width: 560px; }
  section { margin-top: 22px; }
  section h2 { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #888; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1c1c1c; }
  .row:last-child { border-bottom: 0; }
  .row .t { font-size: 14px; }
  .row .s { font-size: 11px; color: #777; margin-top: 2px; max-width: 340px; }
  button.sw { min-width: 92px; padding: 7px 0; border-radius: 20px; border: 1px solid #333; background: #111; color: #aaa; cursor: pointer; font-size: 12px; }
  button.sw.on { background: #0f3d26; border-color: #35d07f; color: #b9f5cf; }
  label.switch { position: relative; display: inline-block; width: 52px; height: 28px; flex-shrink: 0; cursor: pointer; }
  label.switch input { opacity: 0; width: 0; height: 0; }
  label.switch .track { position: absolute; inset: 0; border-radius: 20px; background: #3a3a3a; transition: background .2s; }
  label.switch .track::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform .2s; }
  label.switch input:checked + .track { background: #22b45e; }
  label.switch input:checked + .track::before { transform: translateX(24px); }
  label.switch input:disabled + .track { opacity: .5; cursor: default; }
  button.act { padding: 9px 18px; border-radius: 8px; border: 0; background: #fff; color: #000; cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 10px; }
  button.ghost { background: #1a1a1a; color: #ddd; }
  textarea { width: 100%; background: #0d0d0d; color: #eee; border: 1px solid #262626; border-radius: 8px; padding: 9px; font-size: 12px; height: 64px; font-family: Consolas, monospace; }
  select { width: 100%; background: #0d0d0d; color: #eee; border: 1px solid #262626; border-radius: 6px; padding: 7px 4px; font-size: 11px; }
  label.ck { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 13px; cursor: pointer; }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #fff; }
  #msg { font-size: 12px; color: #ffd479; min-height: 16px; margin-top: 8px; }
  .hint { font-size: 11px; color: #666; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" />
  <h1>OpenCodeGoProxy</h1>
  <span id="dot" title="proxy"></span>
</header>
<main>
  <div id="msg"></div>

  <section>
    <h2>Profiles</h2>
    <div class="row">
      <div><div class="t">Codex</div><div class="s" id="cxInfo">…</div></div>
      <label class="switch"><input type="checkbox" id="cxToggle" /><span class="track"></span></label>
    </div>
    <div class="row">
      <div><div class="t">Claude Code</div><div class="s" id="clInfo">…</div></div>
      <label class="switch"><input type="checkbox" id="clToggle" /><span class="track"></span></label>
    </div>
    <div class="row" id="tiersRow" style="display:none">
      <div style="width:100%">
        <div class="s" style="margin-bottom:6px">Models per tier (both profiles)</div>
        <div style="display:flex;gap:8px">
          <div style="flex:1"><div class="s">Opus</div><select id="tierOpus" style="width:100%"></select></div>
          <div style="flex:1"><div class="s">Sonnet</div><select id="tierSonnet" style="width:100%"></select></div>
          <div style="flex:1"><div class="s">Haiku</div><select id="tierHaiku" style="width:100%"></select></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>OpenCode Go API keys</h2>
    <textarea id="keys" placeholder="One per line: name|sk-...|daily_budget_usd"></textarea>
    <div class="hint" id="savedKeys"></div>
    <button class="act" id="saveKeys">Save keys</button>
  </section>

  <section>
    <h2>Vision (captions for blind models)</h2>
    <select id="visionModel" style="width:100%"></select>
    <div class="hint">Native-vision models only. Applies after proxy restart.</div>
  </section>

  <section>
    <h2>System</h2>
    <label class="ck"><input type="checkbox" id="autoStart" /> Start with Windows <span class="hint" id="autoStartState"></span></label>
    <label class="ck"><input type="checkbox" id="startMinimized" /> Start minimized</label>
    <button class="act ghost" id="saveSystem">Save system</button>
  </section>
</main>
<script>
const { ipcRenderer } = require("electron");
const path = require("node:path");
const $ = (id) => document.getElementById(id);
const msg = (t) => ($("msg").textContent = t || "");
const call = (name, args) => ipcRenderer.invoke("oc:call", name, args || {});
try { $("logo").src = path.join(__dirname, "..", "..", "assets", "tray.png"); } catch (e) {}
let PORT = 11447;

function paintToggle(input, active) {
  input.checked = !!active;
  input.disabled = false;
}

async function refreshStatus() {
  try {
    const r = await fetch(`http://127.0.0.1:${PORT}/health`);
    const j = await r.json();
    $("dot").classList.add("on");
    $("dot").title = `proxy ON (${(j.keys || []).length} key(s))`;
  } catch (e) { $("dot").classList.remove("on"); }
}

async function refreshProfiles() {
  try {
    const st = await call("codexState");
    const on = st.active === "proxy";
    paintToggle($("cxToggle"), on);
    $("cxInfo").textContent = `${st.model || "?"} · ${st.provider || "openai (default)"}`;
  } catch (e) {
    $("cxToggle").disabled = true;
    $("cxInfo").textContent = String((e && e.message) || e).slice(0, 100);
  }
  try {
    const st = await call("claudeState");
    const on = st.active === "proxy";
    paintToggle($("clToggle"), on);
    $("clInfo").textContent = `${st.model || "?"} · ${(st.baseUrl || "?").replace("http://", "")}`;
    await refreshTiers();
  } catch (e) {
    $("clToggle").disabled = true;
    $("clInfo").textContent = String((e && e.message) || e).slice(0, 100);
  }
}

async function refreshTiers() {
  try {
    const [models, tiers] = await Promise.all([call("claudeModels"), call("claudeTiers")]);
    for (const [sel, val] of [["tierOpus", tiers.opus], ["tierSonnet", tiers.sonnet], ["tierHaiku", tiers.haiku]]) {
      const el = $(sel);
      el.innerHTML = "";
      for (const m of models) {
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = m.name;
        if (m.id === val) o.selected = true;
        el.appendChild(o);
      }
    }
    $("tiersRow").style.display = "";
  } catch (e) { /* no tiers */ }
}

for (const sel of ["tierOpus", "tierSonnet", "tierHaiku"]) {
  $(sel).onchange = async () => {
    try {
      await call("claudeTiersSet", {
        opus: $("tierOpus").value, sonnet: $("tierSonnet").value, haiku: $("tierHaiku").value,
      });
      msg("Claude models saved. Applies to new sessions.");
      refreshProfiles();
    } catch (e) { msg("Error: " + ((e && e.message) || e)); }
  };
}

async function refreshSystem() {
  try {
    const { settings, autoStartReal } = await call("sysGet");
    $("autoStart").checked = !!settings.autoStart;
    $("startMinimized").checked = settings.startMinimized !== false;
    $("autoStartState").textContent = autoStartReal ? "(on)" : "";
  } catch (e) { /* no system */ }
}

async function load() {
  try {
    const k = await call("keysGet");
    PORT = k.port || 11447;
    $("savedKeys").textContent = "Saved: " + (k.keys.map((x) => `${x.name} (${x.masked})`).join(" · ") || "none");
    $("keys").value = "";
  } catch (e) { msg("Failed to read config: " + ((e && e.message) || e)); }
  try {
    const v = await call("visionModels");
    const el = $("visionModel");
    el.innerHTML = "";
    for (const m of v.models) {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = `${m.name} ($${m.in}/$${m.out} per 1M)`;
      if (m.id === v.current) o.selected = true;
      el.appendChild(o);
    }
    el.onchange = async () => {
      try {
        await call("visionSet", { model: el.value });
        msg("Vision model saved. Restart via tray.");
      } catch (e) { msg("Error: " + ((e && e.message) || e)); }
    };
  } catch (e) { /* no vision */ }
  refreshStatus();
  refreshProfiles();
  refreshSystem();
}

$("cxToggle").onchange = async () => {
  $("cxToggle").disabled = true;
  try {
    const r = await call("codexToggle");
    if (r && r.restored === false) msg("Did not switch back: " + (r.reason || "?"));
    else msg("Codex updated. Reopen CLI/App.");
    refreshProfiles();
  } catch (e) { msg("Error: " + ((e && e.message) || e)); refreshProfiles(); }
};

$("clToggle").onchange = async () => {
  $("clToggle").disabled = true;
  try {
    const r = await call("claudeToggle");
    if (r && r.restored === false) msg("Did not switch back: " + (r.reason || "?"));
    else msg("Claude updated. New sessions use the active profile.");
    refreshProfiles();
  } catch (e) { msg("Error: " + ((e && e.message) || e)); refreshProfiles(); }
};

$("saveKeys").onclick = async () => {
  try {
    const r = await call("keysSave", { text: $("keys").value });
    $("keys").value = "";
    load();
    msg(`Keys saved (${r.saved}). Restart via tray.`);
  } catch (e) { msg("Error: " + ((e && e.message) || e)); }
};

$("saveSystem").onclick = async () => {
  try {
    await call("sysSave", { autoStart: $("autoStart").checked, startMinimized: $("startMinimized").checked, exePath: process.execPath });
    msg("System saved.");
    refreshSystem();
  } catch (e) { msg("Error: " + ((e && e.message) || e)); }
};

load();
setInterval(refreshStatus, 8000);
</script>
</body>
</html>
