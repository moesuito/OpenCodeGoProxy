<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>OpenCodeGoProxy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", sans-serif; margin: 0; background: #000; color: #f0f0f0; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 22px 6px; }
  header img { width: 30px; height: 30px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #555; margin-left: auto; }
  #dot.on { background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  main { padding: 12px 22px 28px; max-width: 560px; }
  section { margin-top: 22px; }
  section h2 { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #888; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1c1c1c; }
  .row:last-child { border-bottom: 0; }
  .row .t { font-size: 14px; }
  .row .s { font-size: 11px; color: #777; margin-top: 2px; max-width: 340px; }
  button.sw { min-width: 92px; padding: 7px 0; border-radius: 20px; border: 1px solid #333; background: #111; color: #aaa; cursor: pointer; font-size: 12px; }
  button.sw.on { background: #0f3d26; border-color: #35d07f; color: #b9f5cf; }
  button.act { padding: 9px 18px; border-radius: 8px; border: 0; background: #fff; color: #000; cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 10px; }
  button.ghost { background: #1a1a1a; color: #ddd; }
  textarea { width: 100%; background: #0d0d0d; color: #eee; border: 1px solid #262626; border-radius: 8px; padding: 9px; font-size: 12px; height: 64px; font-family: Consolas, monospace; }
  label.ck { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 13px; cursor: pointer; }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #fff; }
  #msg { font-size: 12px; color: #ffd479; min-height: 16px; margin-top: 8px; }
  .hint { font-size: 11px; color: #666; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" />
  <h1>OpenCodeGoProxy</h1>
  <span id="dot" title="proxy"></span>
</header>
<main>
  <div id="msg"></div>

  <section>
    <h2>Profiles</h2>
    <div class="row">
      <div><div class="t">Codex</div><div class="s" id="cxInfo">…</div></div>
      <button class="sw" id="cxToggle">…</button>
    </div>
    <div class="row">
      <div><div class="t">Claude Code</div><div class="s" id="clInfo">…</div></div>
      <button class="sw" id="clToggle">…</button>
    </div>
  </section>

  <section>
    <h2>API keys do OpenCode Go</h2>
    <textarea id="keys" placeholder="Uma por linha: nome|sk-...|orcamento_diario_usd"></textarea>
    <div class="hint" id="savedKeys"></div>
    <button class="act" id="saveKeys">Salvar keys</button>
  </section>

  <section>
    <h2>Sistema</h2>
    <label class="ck"><input type="checkbox" id="autoStart" /> Iniciar com o Windows <span class="hint" id="autoStartState"></span></label>
    <label class="ck"><input type="checkbox" id="startMinimized" /> Iniciar minimizado</label>
    <button class="act ghost" id="saveSystem">Salvar sistema</button>
  </section>
</main>
<script>
const { ipcRenderer } = require("electron");
const path = require("node:path");
const $ = (id) => document.getElementById(id);
const msg = (t) => ($("msg").textContent = t || "");
const call = (name, args) => ipcRenderer.invoke("oc:call", name, args || {});
try { $("logo").src = path.join(__dirname, "..", "..", "assets", "tray.png"); } catch (e) {}
let PORT = 11447;

function paintToggle(btn, active) {
  btn.textContent = active ? "Proxy" : "Normal";
  btn.classList.toggle("on", !!active);
}

async function refreshStatus() {
  try {
    const r = await fetch(`http://127.0.0.1:${PORT}/health`);
    const j = await r.json();
    $("dot").classList.add("on");
    $("dot").title = `proxy ON (${(j.keys || []).length} key(s))`;
  } catch (e) { $("dot").classList.remove("on"); }
}

async function refreshProfiles() {
  try {
    const st = await call("codexState");
    const on = st.active === "proxy";
    paintToggle($("cxToggle"), on);
    $("cxInfo").textContent = `${st.model || "?"} · ${st.provider || "openai (padrão)"}`;
  } catch (e) {
    $("cxToggle").textContent = "erro";
    $("cxInfo").textContent = String((e && e.message) || e).slice(0, 100);
  }
  try {
    const st = await call("claudeState");
    const on = st.active === "proxy";
    paintToggle($("clToggle"), on);
    $("clInfo").textContent = `${st.model || "?"} · ${(st.baseUrl || "?").replace("http://", "")}`;
  } catch (e) {
    $("clToggle").textContent = "erro";
    $("clInfo").textContent = String((e && e.message) || e).slice(0, 100);
  }
}

async function refreshSystem() {
  try {
    const { settings, autoStartReal } = await call("sysGet");
    $("autoStart").checked = !!settings.autoStart;
    $("startMinimized").checked = settings.startMinimized !== false;
    $("autoStartState").textContent = autoStartReal ? "(ativo)" : "";
  } catch (e) { /* sem sistema */ }
}

async function load() {
  try {
    const k = await call("keysGet");
    PORT = k.port || 11447;
    $("savedKeys").textContent = "Salvas: " + (k.keys.map((x) => `${x.name} (${x.masked})`).join(" · ") || "nenhuma");
    $("keys").value = "";
  } catch (e) { msg("Falha ao ler config: " + ((e && e.message) || e)); }
  refreshStatus();
  refreshProfiles();
  refreshSystem();
}

$("cxToggle").onclick = async () => {
  try {
    const r = await call("codexToggle");
    if (r && r.restored === false) msg("Não voltou ao normal: " + (r.reason || "?"));
    else msg("Codex atualizado. Reabra CLI/App.");
    refreshProfiles();
  } catch (e) { msg("Erro: " + ((e && e.message) || e)); }
};

$("clToggle").onclick = async () => {
  try {
    const r = await call("claudeToggle");
    if (r && r.restored === false) msg("Não voltou ao normal: " + (r.reason || "?"));
    else msg("Claude atualizado. Novas sessões usam o profile ativo.");
    refreshProfiles();
  } catch (e) { msg("Erro: " + ((e && e.message) || e)); }
};

$("saveKeys").onclick = async () => {
  try {
    const r = await call("keysSave", { text: $("keys").value });
    $("keys").value = "";
    load();
    msg(`Keys salvas (${r.saved}). Reinicie pelo tray.`);
  } catch (e) { msg("Erro: " + ((e && e.message) || e)); }
};

$("saveSystem").onclick = async () => {
  try {
    await call("sysSave", { autoStart: $("autoStart").checked, startMinimized: $("startMinimized").checked, exePath: process.execPath });
    msg("Sistema salvo.");
    refreshSystem();
  } catch (e) { msg("Erro: " + ((e && e.message) || e)); }
};

load();
setInterval(refreshStatus, 8000);
</script>
</body>
</html>
